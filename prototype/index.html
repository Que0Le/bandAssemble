<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bandAssemble · Import a song (prototype)</title>
    <style>
      :root {
        --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3;
        --muted: #8b949e; --accent: #58a6ff; --chord: #f0b429; --ok: #3fb950; --bad: #6e7681;
        --mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
      header h1 { font-size: 16px; margin: 0; }
      header .sub { color: var(--muted); font-size: 12px; }
      .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 49px); }
      .left { border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      .left label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
      textarea { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px; font: 12px/1.45 var(--mono); resize: vertical; }
      .row { display: flex; align-items: center; gap: 10px; }
      .row input[type='range'] { flex: 1; }
      button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 7px;
        padding: 6px 12px; cursor: pointer; font-size: 13px; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #0b1220; border: none; font-weight: 600; }
      .right { display: flex; flex-direction: column; min-height: 0; }
      .stats { padding: 8px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; align-items: center; font-size: 13px; }
      .stats .cov b { color: var(--ok); }
      .playbar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; max-width: 320px; }
      .playbar > div { height: 100%; width: 0; background: var(--accent); }
      .chart { flex: 1; overflow-y: auto; padding: 10px 18px 60px; }
      .label { margin: 16px 0 6px; color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
      .lrow { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 5px 8px; border-radius: 7px; align-items: start; }
      .lrow.cur { background: #1f2d1f; }
      .lrow .t { color: var(--muted); font: 11px var(--mono); padding-top: 12px; }
      .lrow.unmatched .body { color: var(--bad); font-style: italic; padding-top: 12px; }
      .body { display: flex; flex-wrap: wrap; }
      .seg { display: inline-flex; flex-direction: column; }
      .seg .ch { color: var(--chord); font: 600 12px var(--mono); height: 15px; }
      .seg .tx { white-space: pre; }
      .tag { font-size: 10px; color: var(--bad); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; align-self: center; }
      .exports { border-top: 1px solid var(--line); background: var(--panel); }
      .extabs { display: flex; gap: 6px; padding: 8px 18px 0; }
      .extabs button.on { border-color: var(--accent); color: var(--accent); }
      .expanel { padding: 10px 18px 16px; }
      .expanel pre { margin: 0 0 8px; max-height: 180px; overflow: auto; background: var(--bg); border: 1px solid var(--line);
        border-radius: 8px; padding: 10px; font: 11px/1.45 var(--mono); white-space: pre; }
      .exbtns { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>🎸 bandAssemble · Import a song</h1>
      <span class="sub">prototype — paste Ultimate Guitar / ChordPro + an LRC → a timed chart, exportable to ChordPro &amp; LRC</span>
    </header>
    <div class="wrap">
      <div class="left">
        <div>
          <label>Chords — paste from Ultimate Guitar or ChordPro</label>
          <textarea id="chords" rows="12" spellcheck="false"></textarea>
        </div>
        <div>
          <label>Synced lyrics — .lrc (later: fetched from LRCLIB)</label>
          <textarea id="lrc" rows="9" spellcheck="false"></textarea>
        </div>
        <div class="row">
          <label style="margin:0">Offset</label>
          <input id="offset" type="range" min="-5" max="5" step="0.1" value="0" />
          <span id="offsetVal" style="font:12px var(--mono); width:48px; text-align:right">0.0s</span>
        </div>
        <div class="row">
          <button id="play" class="primary">▶ Play</button>
          <button id="reset">Align</button>
        </div>
      </div>
      <div class="right">
        <div class="stats">
          <span class="cov">coverage <b id="cov">—</b></span>
          <span id="labels" style="color:var(--muted); font-size:12px"></span>
          <span id="clock" style="font:12px var(--mono); color:var(--muted)">0:00.0</span>
          <div class="playbar"><div id="prog"></div></div>
        </div>
        <div class="chart" id="chart"></div>
        <div class="exports">
          <div class="extabs">
            <button data-ex="cho" class="on">ChordPro (.cho)</button>
            <button data-ex="lrc">LRC (.lrc)</button>
            <button data-ex="json">Chart JSON (paste into app)</button>
          </div>
          <div class="expanel">
            <pre id="exout"></pre>
            <div class="exbtns">
              <button id="copy">Copy</button>
              <button id="download">Download</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/gui.js"></script>
  </body>
</html>
